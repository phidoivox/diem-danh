services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detect-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DETECT_AI_HOST=0.0.0.0
      - DETECT_AI_PORT=8000
      - DETECT_AI_CORS_ORIGINS=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: detect-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API=http://localhost:8000
    depends_on:
      - backend
