[project]
name = "detect-ai"
version = "0.1.0"
description = "He thong quan ly lop hoc thong minh (diem danh thu cong + Cron + bao cao cam thi)"
readme = "README.md"
authors = [
    { name = "Võ Hoàng Nam", email = "86737094+phidoivox@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "aiosqlite>=0.19",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "ultralytics>=8.3",  # train/export/bench tooling (runtime inference dùng onnxruntime trực tiếp)
    "insightface>=0.7",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "python-multipart>=0.0.9",
    "loguru>=0.7",
    "pyyaml>=6",
    "pwdlib[bcrypt]>=0.2",
    "prometheus-fastapi-instrumentator>=7",
    "asyncpg>=0.29",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "apscheduler>=3.10.4",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
training = [
    "roboflow>=1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
detect-ai = "detect_ai:main"
detect-ai-doctor = "detect_ai.doctor:main"
detect-ai-export-onnx = "detect_ai.ai.export_yolo_onnx:main"
detect-ai-bench-yolo = "detect_ai.ai.bench_yolo_onnx:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
